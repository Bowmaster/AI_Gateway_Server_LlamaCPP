# LiteLLM OSS gateway config (skeleton). Clients request the `model_name` alias;
# LiteLLM routes to the engine upstream. Per-device virtual keys, budgets, and
# model-access groups are created at runtime via the UI/API (backed by Postgres),
# not in this file.

model_list:
  # GPU box (Blackwell) — quantized 7B-14B, OpenAI-compatible llama-server
  - model_name: qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder-7b      # passthrough name the engine serves
      api_base: os.environ/ENGINE_GPU_BASE
      api_key: "none"                      # llama-server needs no key on the private VLAN

  - model_name: gemma4-e4b
    litellm_params:
      model: openai/gemma-4-e4b
      api_base: os.environ/ENGINE_GPU_BASE
      api_key: "none"

  # CPU box (dual Xeon, 256GB) — big MoE, slow-but-patient tier
  - model_name: qwen3-next-80b
    litellm_params:
      model: openai/qwen3-next-80b-a3b
      api_base: os.environ/ENGINE_CPU_BASE
      api_key: "none"

  # --- ollama variant (if you choose ollama instead of raw llama-server) ---
  # - model_name: qwen2.5-coder
  #   litellm_params:
  #     model: ollama_chat/qwen2.5-coder:7b
  #     api_base: http://10.30.0.11:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL    # enables virtual keys + budgets + spend

litellm_settings:
  drop_params: true            # tolerate client params llama-server doesn't accept
  # request_timeout: 600       # long timeout for slow CPU/MoE generations
